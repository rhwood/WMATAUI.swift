version: 2
updates:
- package-ecosystem: swift
  directory: "/"
  schedule:
    interval: monthly
  cooldown:
    default-days: 7
  groups:
    swift-dependencies:
      applies-to: version-updates
      patterns:
        - "*"    
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: monthly
  cooldown:
    default-days: 7
  groups:
    github-actions:
      applies-to: version-updates
      patterns:
        - "*"
